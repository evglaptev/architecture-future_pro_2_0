name: 'Terraform CI/CD Pipeline'

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'Task2Advanced/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'Task2Advanced/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
        - dev
        - stage
        - prod
      action:
        description: 'Action to perform'
        required: true
        default: 'plan'
        type: choice
        options:
        - plan
        - apply
        - destroy

env:
  TF_VERSION: '1.5.7'
  TF_ROOT: 'Task2Advanced'

jobs:
  # Job для проверки кода
  validate:
    name: 'Validate Terraform'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_ROOT }}
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Terraform Format Check
      run: terraform fmt -check -recursive

    - name: Terraform Init (Dev)
      run: |
        cd envs/dev
        terraform init -backend=false

    - name: Terraform Validate (Dev)
      run: |
        cd envs/dev
        terraform validate

    - name: Terraform Init (Stage)
      run: |
        cd envs/stage
        terraform init -backend=false

    - name: Terraform Validate (Stage)
      run: |
        cd envs/stage
        terraform validate

    - name: Terraform Init (Prod)
      run: |
        cd envs/prod
        terraform init -backend=false

    - name: Terraform Validate (Prod)
      run: |
        cd envs/prod
        terraform validate

  # Job для планирования изменений
  plan:
    name: 'Plan Terraform'
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request' || github.event.inputs.action == 'plan'
    defaults:
      run:
        working-directory: ${{ env.TF_ROOT }}
    
    strategy:
      matrix:
        environment: [dev, stage, prod]
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Configure AWS credentials for S3 backend
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.YC_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.YC_SECRET_ACCESS_KEY }}
        aws-region: ru-central1

    - name: Terraform Init
      run: |
        cd envs/${{ matrix.environment }}
        terraform init \
          -backend-config="access_key=${{ secrets.YC_ACCESS_KEY_ID }}" \
          -backend-config="secret_key=${{ secrets.YC_SECRET_ACCESS_KEY }}"

    - name: Terraform Plan
      run: |
        cd envs/${{ matrix.environment }}
        terraform plan \
          -var="yandex_token=${{ secrets.YANDEX_TOKEN }}" \
          -var="cloud_id=${{ secrets.YC_CLOUD_ID }}" \
          -var="folder_id=${{ secrets.YC_FOLDER_ID }}" \
          -var="subnet_id=${{ secrets.YC_SUBNET_ID }}" \
          -var="ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}" \
          -out=tfplan

    - name: Upload Plan Artifact
      uses: actions/upload-artifact@v4
      with:
        name: terraform-plan-${{ matrix.environment }}
        path: ${{ env.TF_ROOT }}/envs/${{ matrix.environment }}/tfplan

  # Job для применения изменений
  apply:
    name: 'Apply Terraform'
    runs-on: ubuntu-latest
    needs: [validate, plan]
    if: github.ref == 'refs/heads/main' && (github.event.inputs.action == 'apply' || github.event.inputs.action == 'destroy')
    environment: ${{ github.event.inputs.environment || 'dev' }}
    defaults:
      run:
        working-directory: ${{ env.TF_ROOT }}
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Configure AWS credentials for S3 backend
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.YC_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.YC_SECRET_ACCESS_KEY }}
        aws-region: ru-central1

    - name: Download Plan Artifact
      uses: actions/download-artifact@v4
      with:
        name: terraform-plan-${{ github.event.inputs.environment || 'dev' }}
        path: ${{ env.TF_ROOT }}/envs/${{ github.event.inputs.environment || 'dev' }}/

    - name: Terraform Init
      run: |
        cd envs/${{ github.event.inputs.environment || 'dev' }}
        terraform init \
          -backend-config="access_key=${{ secrets.YC_ACCESS_KEY_ID }}" \
          -backend-config="secret_key=${{ secrets.YC_SECRET_ACCESS_KEY }}"

    - name: Terraform Apply
      if: github.event.inputs.action == 'apply'
      run: |
        cd envs/${{ github.event.inputs.environment || 'dev' }}
        terraform apply -auto-approve tfplan

    - name: Terraform Destroy
      if: github.event.inputs.action == 'destroy'
      run: |
        cd envs/${{ github.event.inputs.environment || 'dev' }}
        terraform destroy \
          -var="yandex_token=${{ secrets.YANDEX_TOKEN }}" \
          -var="cloud_id=${{ secrets.YC_CLOUD_ID }}" \
          -var="folder_id=${{ secrets.YC_FOLDER_ID }}" \
          -var="subnet_id=${{ secrets.YC_SUBNET_ID }}" \
          -var="ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}" \
          -auto-approve

    - name: Terraform Output
      if: github.event.inputs.action == 'apply'
      run: |
        cd envs/${{ github.event.inputs.environment || 'dev' }}
        terraform output

  # Job для уведомлений
  notify:
    name: 'Notify'
    runs-on: ubuntu-latest
    needs: [validate, plan, apply]
    if: always()
    
    steps:
    - name: Notify Success
      if: needs.apply.result == 'success'
      run: |
        echo "✅ Terraform deployment completed successfully!"
        echo "Environment: ${{ github.event.inputs.environment || 'dev' }}"
        echo "Action: ${{ github.event.inputs.action || 'plan' }}"

    - name: Notify Failure
      if: needs.validate.result == 'failure' || needs.plan.result == 'failure' || needs.apply.result == 'failure'
      run: |
        echo "❌ Terraform deployment failed!"
        echo "Check the logs for details."
        exit 1
