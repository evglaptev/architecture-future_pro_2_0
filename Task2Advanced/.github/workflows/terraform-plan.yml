name: terraform-plan

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "Task1Advanced/**"
      - "Task2Advanced/**"
  pull_request:
    paths:
      - "Task1Advanced/**"
      - "Task2Advanced/**"

concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.6

      - name: terraform fmt
        run: terraform fmt -check -recursive Task1Advanced Task2Advanced

      - name: Static validation
        run: |
          cd Task2Advanced/envs/dev
          terraform init -backend=false
          terraform validate

  plan:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, stage, prod]
    environment: ${{ matrix.environment }}
    defaults:
      run:
        working-directory: Task2Advanced/envs/${{ matrix.environment }}
    env:
      YC_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
      YC_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
      TF_VAR_yandex_token: ${{ secrets.YANDEX_TOKEN }}
      TF_VAR_cloud_id: ${{ secrets.YC_CLOUD_ID }}
      TF_VAR_folder_id: ${{ secrets.YC_FOLDER_ID }}
      TF_VAR_subnet_id: ${{ secrets.YC_SUBNET_ID }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.6

      - name: Verify required secrets
        run: ../../scripts/validate-secrets.sh

      - name: terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ env.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.YC_SECRET_ACCESS_KEY }}
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ vars.STATE_BUCKET }}"
          -backend-config="endpoint=${{ vars.S3_ENDPOINT }}"
          -backend-config="region=${{ vars.AWS_REGION }}"
          -backend-config="dynamodb_table=${{ vars.LOCK_TABLE }}"
          -backend-config="skip_credentials_validation=true"
          -backend-config="skip_region_validation=true"
          -backend-config="skip_metadata_api_check=true"
          -backend-config="force_path_style=true"

      - name: terraform plan
        env:
          AWS_ACCESS_KEY_ID: ${{ env.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.YC_SECRET_ACCESS_KEY }}
        run: terraform plan -input=false -var-file="terraform.tfvars" -out="plan-${{ matrix.environment }}.tfplan"

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: plan-${{ matrix.environment }}
          path: Task2Advanced/envs/${{ matrix.environment }}/plan-${{ matrix.environment }}.tfplan

